# SPDX-License-Identifier: MIT
---
name: '🎨 Themes - Regen Drift Check'

'on':
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: regen-themes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: '🎨 Theme Drift Check'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # read: checkout only; the drift check never writes
      contents: read
    steps:
      - name: '🛡️ Harden runner'
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443
            release.bun.sh:443
            release-assets.githubusercontent.com:443
      - name: '📥 Checkout'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: '🥟 Setup Bun'
        # yamllint disable-line rule:line-length
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: '🎨 Check theme drift'
        shell: bash
        run: scripts/ci/check-theme-drift.sh
      - name: '🧪 Type-check scripts'
        shell: bash
        run: bun run typecheck
