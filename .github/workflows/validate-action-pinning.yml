---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-hass-turbo-themes): validate / 📌 Validate Action Pinning
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@c40cd60334b5b5f2952e1af99e2e083be50c1620 # v0.80.0
    with:
      job-name: '📌 Validate Action Pinning'
      tooling-ref: 'c40cd60334b5b5f2952e1af99e2e083be50c1620' # v0.80.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
