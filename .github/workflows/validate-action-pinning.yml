---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-hass-turbo-themes): validate / 📌 Validate Action Pinning
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@c9f52d4f45ba33ee995a7f12ed46ebfc01f6b68d # v0.98.6
    with:
      job-name: '📌 Validate Action Pinning'
      tooling-ref: 'c9f52d4f45ba33ee995a7f12ed46ebfc01f6b68d' # v0.98.6
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
