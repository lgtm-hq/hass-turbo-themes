---
name: Security - Dependency Review

'on':
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-dependency-review.yml@e10242e81ebb34ceb796efeff39ba9824178f46e # v0.75.2
    with:
      fail-on-severity: high
      tooling-ref: 'e10242e81ebb34ceb796efeff39ba9824178f46e' # v0.75.2
      egress-policy: block
      egress-preset: scorecard
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        api.deps.dev:443
        release-assets.githubusercontent.com:443
    permissions:
      contents: read
      pull-requests: read
