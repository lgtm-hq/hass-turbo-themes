---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@c9f52d4f45ba33ee995a7f12ed46ebfc01f6b68d # v0.98.6
    with:
      job-name: '👤 Auto Assign PR Author'
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'c9f52d4f45ba33ee995a7f12ed46ebfc01f6b68d' # v0.98.6
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
