---
name: PR - Title Validation
# Validates PR titles follow Conventional Commits format.

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-hass-turbo-themes): semantic-title / 📝 Validate PR Title
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@c9f52d4f45ba33ee995a7f12ed46ebfc01f6b68d # v0.98.6
    with:
      job-name: '📝 Validate PR Title'
      tooling-ref: 'c9f52d4f45ba33ee995a7f12ed46ebfc01f6b68d' # v0.98.6
      egress-policy: block
      egress-preset: github-tooling
      comment-marker: '<!-- semantic-pr-title -->'
    permissions:
      contents: read
      pull-requests: write
