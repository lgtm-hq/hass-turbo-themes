# SPDX-License-Identifier: MIT
---
name: '🧾 Release - Upstream Provenance'

'on':
  release:
    types: [published]

permissions: {}

concurrency:
  # yamllint disable-line rule:line-length
  group: release-upstream-provenance-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  append-upstream-provenance:
    name: '🧾 Append upstream provenance'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: '🛡️ Harden runner'
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
      - name: '📥 Checkout release ref'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: '🧾 Append upstream provenance'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          UPSTREAM_PACKAGE: '@lgtm-hq/turbo-themes'
        run: scripts/release/append-upstream-provenance.sh
